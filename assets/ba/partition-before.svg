<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img" aria-label="Partition — before">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e0a5c0"/><stop offset="1" stop-color="#9b3a72"/></linearGradient>
    <filter id="s" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0a2540" flood-opacity="0.18"/></filter>
  </defs>
  <style>
    .plot{animation:floatY 4.6s ease-in-out infinite}
    .b1{transform-box:fill-box;transform-origin:center;animation:drift 9s ease-in-out infinite}
    .b2{transform-box:fill-box;transform-origin:center;animation:drift 11s ease-in-out infinite .6s}
    @keyframes floatY{50%{transform:translateY(-6px)}}
    @keyframes drift{50%{transform:translate(5px,-5px) scale(1.05)}}
    @media (prefers-reduced-motion:reduce){.plot,.b1,.b2{animation:none}}
  </style>
  <rect width="400" height="260" fill="url(#g)"/>
  <circle class="b1" cx="58" cy="44" r="72" fill="#fff" opacity=".10"/>
  <circle class="b2" cx="348" cy="216" r="88" fill="#fff" opacity=".08"/>
  <g transform="translate(104 48)"><g class="plot" filter="url(#s)"><g stroke="#fff" stroke-width="5" fill="none" stroke-linejoin="round"><path d="M14 88 L96 8 L182 34 L160 118 Z"/></g><g fill="#fff"><circle cx="14" cy="88" r="9"/><circle cx="96" cy="8" r="9"/><circle cx="182" cy="34" r="9"/><circle cx="160" cy="118" r="9"/></g></g></g>
  <text x="200" y="214" text-anchor="middle" font-family="Inter,system-ui,sans-serif"
        font-size="19" font-weight="700" fill="#fff" opacity=".96">Partition — before</text>
  <text x="200" y="236" text-anchor="middle" font-family="Inter,system-ui,sans-serif"
        font-size="11" font-weight="600" fill="#fff" opacity=".72" letter-spacing="1.1">PLACEHOLDER — REPLACE</text>
</svg>
