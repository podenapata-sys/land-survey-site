    <h1 data-en="Accuracy Notice" data-bn="নির্ভুলতা বিজ্ঞপ্তি"></h1>
    <p class="legal-updated" data-en="Last updated: 20 September 2026" data-bn="সর্বশেষ হালনাগাদ: ২০ সেপ্টেম্বর ২০২৬"></p>

    <div class="legal-doc">

      <div class="legal-callout">
        <p data-en="Nothing on this website is a measurement of your land. The figures shown by the fee estimator and the area converter are indicative only. The area of your land is established by a signed field survey report and by nothing else on this site."
           data-bn="এই ওয়েবসাইটের কোনো কিছুই আপনার জমির পরিমাপ নয়। খরচের হিসাব ও একক রূপান্তরে দেখানো সংখ্যা শুধুমাত্র ধারণা দেয়। আপনার জমির প্রকৃত পরিমাণ নির্ধারিত হয় স্বাক্ষরিত মাঠ জরিপ রিপোর্টে — এই সাইটের অন্য কিছুতে নয়।"></p>
      </div>

      <h2 data-en="The fee estimator" data-bn="খরচের হিসাব"></h2>
      <p data-en="The estimator multiplies a published rate by an area you type in. It does not know your plot, its shape, its terrain, how many corners it has, whether the boundary is disputed, or what the record room holds. It is a guide to cost, not a quotation and not a survey."
         data-bn="হিসাবটি প্রকাশিত হার ও আপনার দেওয়া পরিমাণ গুণ করে দেখায়। এটি আপনার জমি, তার আকৃতি, ভূমিরূপ, কয়টি কোণ, সীমানা নিয়ে বিরোধ আছে কি না, বা রেকর্ড রুমে কী আছে — কিছুই জানে না। এটি খরচের ধারণা, দরপত্র নয় এবং জরিপও নয়।"></p>
      <p data-en="The final fee is confirmed after we have seen the plot and the papers. It can be higher or lower than the estimate."
         data-bn="জমি ও কাগজপত্র দেখার পর চূড়ান্ত খরচ জানানো হয়। তা হিসাবের চেয়ে বেশি বা কম হতে পারে।"></p>

      <h2 data-en="Area units and regional variation" data-bn="জমির একক ও আঞ্চলিক ভিন্নতা"></h2>
      <p data-en="The converter on this site uses the greater-Khulna standard: 1 katha = 720 square feet, 1 bigha = 20 katha = 14,400 square feet, 1 acre = 43,560 square feet, 1 decimal = 435.6 square feet."
         data-bn="এই সাইটের রূপান্তরে প্রচলিত কাঠার মান ব্যবহৃত হয়: ১ কাঠা = ৭২০ বর্গফুট, ১ বিঘা = ২০ কাঠা = ১৪,৪০০ বর্গফুট, ১ একর = ৪৩,৫৬০ বর্গফুট, ১ শতক = ৪৩৫.৬ বর্গফুট।"></p>
      <p data-en="Katha and bigha are not uniform across Bangladesh. In parts of Sylhet, Chattogram and Rajshahi a bigha covers a different area, and local custom sometimes differs again from the district standard. If your papers were drawn up under a different local measure, the converted figure on this page will not match them. Tell us which measure your documents use."
         data-bn="কাঠা ও বিঘা সারা বাংলাদেশে এক নয়। সিলেট, চট্টগ্রাম ও রাজশাহীর কোথাও কোথাও বিঘার পরিমাণ ভিন্ন, আবার স্থানীয় প্রচলন জেলার মান থেকেও আলাদা হতে পারে। আপনার কাগজ অন্য স্থানীয় মাপে তৈরি হলে এই পাতার রূপান্তরিত সংখ্যা তার সঙ্গে মিলবে না। আপনার দলিলে কোন মাপ ব্যবহৃত হয়েছে তা আমাদের জানান।"></p>
      <p data-en="The converter is arithmetic on the standard above. It is not a statement about your plot."
         data-bn="রূপান্তরটি উপরের মানের ভিত্তিতে শুধুই গাণিতিক হিসাব। এটি আপনার জমি সম্পর্কে কোনো বক্তব্য নয়।"></p>

      <h2 data-en="What the survey report establishes" data-bn="জরিপ রিপোর্টে যা নির্ধারিত হয়"></h2>
      <p data-en="A signed field survey report states the area we measured, the method and instrument used, the date of measurement, and the boundary as we found it on the ground on that date. It is the only document from us that states your area."
         data-bn="স্বাক্ষরিত মাঠ জরিপ রিপোর্টে থাকে পরিমাপকৃত পরিমাণ, ব্যবহৃত পদ্ধতি ও যন্ত্র, পরিমাপের তারিখ, এবং সেই তারিখে মাঠে পাওয়া সীমানা। আমাদের দেওয়া কেবল এই দলিলেই আপনার জমির পরিমাণ উল্লেখ থাকে।"></p>
      <p data-en="Accuracy depends on the method, and the report says which was used. Total station and GNSS work is accurate to within a few centimetres on a normal plot. Chain-and-tape measurement is coarser. We will tell you which method your job needs before you book it."
         data-bn="নির্ভুলতা পদ্ধতির উপর নির্ভর করে এবং রিপোর্টে কোন পদ্ধতি ব্যবহৃত হয়েছে তা লেখা থাকে। সাধারণ জমিতে টোটাল স্টেশন ও জিএনএসএসের কাজ কয়েক সেন্টিমিটার পর্যন্ত নির্ভুল। চেইন-ফিতার মাপ তুলনামূলকভাবে কম নিখুঁত। বুকিংয়ের আগেই আপনার কাজে কোন পদ্ধতি দরকার তা জানিয়ে দেওয়া হয়।"></p>

      <h2 data-en="Record searches reflect a date" data-bn="রেকর্ড অনুসন্ধান একটি নির্দিষ্ট তারিখের"></h2>
      <p data-en="A khatian, mouza map or dag verification reports what the record room held on the day we searched it. Records are amended, corrected and superseded. A mutation filed after our search will not appear in it, and an older record may itself be wrong."
         data-bn="খতিয়ান, মৌজা ম্যাপ বা দাগ যাচাই কেবল অনুসন্ধানের দিনে রেকর্ড রুমে যা ছিল তা-ই জানায়। রেকর্ড সংশোধিত ও পরিবর্তিত হয়। আমাদের অনুসন্ধানের পরে করা নামজারি এতে আসবে না, আবার পুরোনো রেকর্ড নিজেই ভুল হতে পারে।"></p>
      <p data-en="We report what we found. We do not warrant that the record itself is correct."
         data-bn="আমরা যা পেয়েছি তা-ই জানাই। রেকর্ডটি নিজে সঠিক কি না, তার নিশ্চয়তা আমরা দিই না।"></p>

      <h2 data-en="This is not legal advice or a title opinion" data-bn="এটি আইনি পরামর্শ বা মালিকানার মতামত নয়"></h2>
      <p data-en="A survey establishes measurement and position. It does not establish who owns the land, whether a transfer is valid, whether a mortgage or injunction exists, or whether a sale should proceed. Pre-purchase verification reports what the papers and the ground show and where they disagree — it is not a guarantee of good title. For questions of ownership and enforceability, consult a lawyer."
         data-bn="জরিপে পরিমাপ ও অবস্থান নির্ধারিত হয়। জমির মালিক কে, হস্তান্তর বৈধ কি না, বন্ধক বা নিষেধাজ্ঞা আছে কি না, কিংবা ক্রয় করা উচিত কি না — এসব জরিপে নির্ধারিত হয় না। কেনার আগে যাচাইয়ে কাগজ ও বাস্তব জমিতে কী দেখা যাচ্ছে এবং কোথায় অমিল আছে তা জানানো হয় — এটি নিষ্কণ্টক মালিকানার নিশ্চয়তা নয়। মালিকানা ও আইনগত প্রশ্নে আইনজীবীর পরামর্শ নিন।"></p>

      <h2 data-en="Reports used in court or in a transaction" data-bn="আদালতে বা লেনদেনে ব্যবহৃত রিপোর্ট"></h2>
      <p data-en="Our reports are signed and sealed and are prepared to be filed. Whether a court admits or relies on any report is a matter for the court. A court-appointed commission survey is a separate engagement with its own procedure — tell us at the outset if that is what has been ordered, because a report prepared for you privately is not a substitute for it."
         data-bn="আমাদের রিপোর্ট স্বাক্ষরিত ও সিলমোহরযুক্ত এবং দাখিলের উপযোগী করে তৈরি। কোনো রিপোর্ট আদালত গ্রহণ করবে কি না, তা আদালতের এখতিয়ার। আদালত নিযুক্ত কমিশন জরিপ আলাদা প্রক্রিয়ার কাজ — এমন আদেশ থাকলে শুরুতেই জানান, কারণ ব্যক্তিগতভাবে করানো রিপোর্ট তার বিকল্প নয়।"></p>

      <h2 data-en="Boundary disputes" data-bn="সীমানা নিয়ে বিরোধ"></h2>
      <p data-en="Where a neighbour disputes a boundary, our report records what we measured and where the record places the line. It does not settle the dispute and it does not bind anyone who did not engage us. Pillars we place mark our findings; they do not create a legal boundary."
         data-bn="প্রতিবেশী সীমানা নিয়ে আপত্তি করলে আমাদের রিপোর্টে আমরা যা মেপেছি এবং রেকর্ড অনুযায়ী সীমানা কোথায় পড়ে তা লিপিবদ্ধ থাকে। এতে বিরোধ মীমাংসা হয় না এবং যিনি আমাদের নিয়োগ করেননি তিনি এতে বাধ্য নন। আমাদের বসানো পিলার আমাদের প্রাপ্ত ফলাফল চিহ্নিত করে; এটি আইনি সীমানা তৈরি করে না।"></p>

      <h2 data-en="Sample work shown on this site" data-bn="এই সাইটে দেখানো নমুনা কাজ"></h2>
      <p data-en="Images in the gallery and in the before-and-after slider are illustrative and redacted. They are not any client's actual plot, and no plot position, owner name, dag number or khatian number shown on this site refers to a real holding."
         data-bn="গ্যালারি ও আগে-পরের স্লাইডারের ছবিগুলো প্রতীকী এবং তথ্য গোপন রাখা। এগুলো কোনো ক্লায়েন্টের প্রকৃত জমি নয়, এবং এই সাইটে দেখানো কোনো অবস্থান, মালিকের নাম, দাগ নম্বর বা খতিয়ান নম্বর কোনো বাস্তব জমিকে বোঝায় না।"></p>

      <h2 data-en="Questions" data-bn="প্রশ্ন"></h2>
      <p data-en="If anything here is unclear, or if a figure on this site does not match your documents, ask before you rely on it. Contact details are on the contact section of the home page."
         data-bn="এখানে কিছু অস্পষ্ট মনে হলে, বা এই সাইটের কোনো সংখ্যা আপনার কাগজের সঙ্গে না মিললে, তার উপর নির্ভর করার আগে জিজ্ঞাসা করুন। যোগাযোগের তথ্য হোম পেজের যোগাযোগ অংশে রয়েছে।"></p>
