    <p class="legal-updated" data-en="Last updated: 17 July 2026" data-bn="সর্বশেষ হালনাগাদ: ১৭ জুলাই ২০২৬"></p>

<article class="section" style="padding-top:20px"><div class="container"><div class="legal-doc">

  <p data-en="Khulna Divisional Digital Surveyors Association (“we”, “us”, “our”) respects your privacy. This policy explains what personal information we collect through this website, how we use it, who we share it with, and the choices you have. By using this website or contacting us through it, you agree to this policy." data-bn="খুলনা বিভাগীয় ডিজিটাল সার্ভেয়ার এসোসিয়েশন (“আমরা”, “আমাদের”) আপনার গোপনীয়তাকে সম্মান করে। এই পলিসিতে ব্যাখ্যা করা হয়েছে আমরা এই ওয়েবসাইটের মাধ্যমে কী কী ব্যক্তিগত তথ্য সংগ্রহ করি, কীভাবে ব্যবহার করি, কার সঙ্গে শেয়ার করি এবং আপনার কী কী অধিকার আছে। এই ওয়েবসাইট ব্যবহার করে বা এর মাধ্যমে যোগাযোগ করে আপনি এই পলিসিতে সম্মতি দিচ্ছেন।"></p>

  <h2 data-en="Who we are" data-bn="আমরা কারা"></h2>
  <p data-en="Khulna Divisional Digital Surveyors Association is a land survey practice located at Street address line, Khulna. For any privacy question, contact us by phone at 01XXXXXXXXX, on WhatsApp at 01XXXXXXXXX, or by email at hello@example.com." data-bn="খুলনা বিভাগীয় ডিজিটাল সার্ভেয়ার এসোসিয়েশন একটি ভূমি জরিপ প্রতিষ্ঠান, ঠিকানা: ঠিকানা, খুলনা। গোপনীয়তা সংক্রান্ত যেকোনো প্রশ্নে ফোন করুন ০১XXXXXXXXX নম্বরে, হোয়াটসঅ্যাপ ০১XXXXXXXXX, অথবা ইমেইল hello@example.com।"></p>

  <h2 data-en="What information we collect" data-bn="আমরা কী তথ্য সংগ্রহ করি"></h2>
  <p data-en="When you use our booking form, callback request, or job-application links, you may provide:" data-bn="আপনি যখন আমাদের বুকিং ফর্ম, কলব্যাক অনুরোধ বা চাকরির আবেদন লিংক ব্যবহার করেন, তখন আপনি দিতে পারেন:"></p>
  <ul>
    <li data-en="Your name and phone number" data-bn="আপনার নাম ও ফোন নম্বর"></li>
    <li data-en="The service you are interested in, the plot it concerns, and your preferred date" data-bn="আপনি যে সেবায় আগ্রহী, কোন জমি সংক্রান্ত, এবং আপনার পছন্দের তারিখ"></li>
    <li data-en="Any message you write, such as your area or symptoms (optional)" data-bn="আপনি যা লেখেন, যেমন আপনার এলাকা বা উপসর্গ (ঐচ্ছিক)"></li>
    <li data-en="For job applications: the details and CV you choose to send us" data-bn="চাকরির আবেদনের জন্য: আপনি যে তথ্য ও সিভি পাঠাতে চান"></li>
  </ul>
  <p data-en="Because our forms open WhatsApp for you to send the message, we only receive what you actually choose to send. Our website does not run its own analytics or advertising trackers." data-bn="যেহেতু আমাদের ফর্মগুলো মেসেজ পাঠানোর জন্য হোয়াটসঅ্যাপ খুলে দেয়, আমরা কেবল সেটুকুই পাই যা আপনি সত্যিকারভাবে পাঠাতে বেছে নেন। আমাদের ওয়েবসাইট নিজস্ব কোনো অ্যানালিটিক্স বা বিজ্ঞাপন ট্র্যাকার চালায় না।"></p>

  <h2 data-en="How your information reaches us" data-bn="আপনার তথ্য কীভাবে আমাদের কাছে আসে"></h2>
  <div class="legal-callout"><p data-en="Important: our booking, callback and “apply” buttons send your details as a WhatsApp message. This means your information is also processed by WhatsApp and its parent company Meta, on their servers and under their own privacy terms. If you prefer not to use WhatsApp, you can call us instead." data-bn="গুরুত্বপূর্ণ: আমাদের বুকিং, কলব্যাক ও “আবেদন” বোতামগুলো আপনার তথ্য একটি হোয়াটসঅ্যাপ মেসেজ হিসেবে পাঠায়। এর মানে আপনার তথ্য হোয়াটসঅ্যাপ ও তার মূল প্রতিষ্ঠান মেটার সার্ভারে, তাদের নিজস্ব গোপনীয়তা শর্তে প্রক্রিয়াজাত হয়। হোয়াটসঅ্যাপ ব্যবহার করতে না চাইলে আপনি সরাসরি ফোন করতে পারেন।"></p></div>

  <h2 data-en="Why we use your information" data-bn="আমরা কেন আপনার তথ্য ব্যবহার করি"></h2>
  <p data-en="We use the information only to respond to you, arrange and confirm site visits, answer your questions, provide the care you request, and — for job applicants — assess your application. We do not sell your information or use it for advertising." data-bn="আমরা তথ্য কেবল আপনাকে উত্তর দিতে, সাইট ভিজিট ঠিক ও নিশ্চিত করতে, আপনার প্রশ্নের উত্তর দিতে, আপনার চাওয়া সেবা দিতে এবং — চাকরিপ্রার্থীদের ক্ষেত্রে — আবেদন যাচাই করতে ব্যবহার করি। আমরা আপনার তথ্য বিক্রি করি না বা বিজ্ঞাপনে ব্যবহার করি না।"></p>

  <h2 data-en="Third-party services we use" data-bn="আমরা যেসব তৃতীয় পক্ষের সেবা ব্যবহার করি"></h2>
  <ul>
    <li data-en="WhatsApp / Meta — to receive your messages and survey enquiries" data-bn="হোয়াটসঅ্যাপ / মেটা — আপনার মেসেজ ও জরিপের অনুরোধ পেতে"></li>
    <li data-en="Google Maps and Google Fonts — to show our location and display the site correctly" data-bn="গুগল ম্যাপ ও গুগল ফন্ট — আমাদের অবস্থান দেখাতে ও সাইট সঠিকভাবে প্রদর্শন করতে"></li>
    <li data-en="Google reCAPTCHA — to check that an enquiry comes from a person and not an automated script. It runs quietly in the background and shows a small badge in the corner of the page; Google&#39;s own privacy policy and terms apply to it." data-bn="গুগল reCAPTCHA — অনুরোধটি কোনো মানুষের কাছ থেকে আসছে, নাকি স্বয়ংক্রিয় স্ক্রিপ্ট থেকে, তা যাচাই করতে। এটি নীরবে কাজ করে ও পাতার কোণায় একটি ছোট ব্যাজ দেখায়; এর ক্ষেত্রে গুগলের নিজস্ব গোপনীয়তা নীতি ও শর্তাবলি প্রযোজ্য।"></li>
    <li data-en="YouTube (privacy-enhanced mode) — for any explainer videos we embed" data-bn="ইউটিউব (গোপনীয়তা-সুরক্ষিত মোড) — আমরা যেসব ব্যাখ্যামূলক ভিডিও যুক্ত করি তার জন্য"></li>
    <li data-en="Disqus — to show the community comments section (it may set its own cookies)" data-bn="ডিসকাস — কমিউনিটি কমেন্ট অংশ দেখাতে (এটি নিজস্ব কুকি সেট করতে পারে)"></li>
    <li data-en="GitHub Pages — the hosting service that serves this website" data-bn="গিটহাব পেজেস — এই ওয়েবসাইট পরিবেশনকারী হোস্টিং সেবা"></li>
  </ul>
  <p data-en="These providers have their own privacy policies, which govern how they handle data on their platforms." data-bn="এই সেবাদাতাদের নিজস্ব গোপনীয়তা পলিসি আছে, যা তাদের প্ল্যাটফর্মে তথ্য পরিচালনার নিয়ম ঠিক করে।"></p>

  <h2 data-en="Cookies and tracking" data-bn="কুকি ও ট্র্যাকিং"></h2>
  <p data-en="This site uses a small amount of local storage to remember your language choice. Some third-party features — such as the Disqus comments, Google Maps and embedded YouTube videos — may set their own cookies when they load. You can view, block or delete cookies at any time through your browser settings." data-bn="এই সাইট আপনার ভাষা পছন্দ মনে রাখতে সামান্য লোকাল স্টোরেজ ব্যবহার করে। কিছু তৃতীয় পক্ষের ফিচার — যেমন ডিসকাস কমেন্ট, গুগল ম্যাপ ও যুক্ত ইউটিউব ভিডিও — লোড হওয়ার সময় নিজস্ব কুকি সেট করতে পারে। আপনি যেকোনো সময় আপনার ব্রাউজার সেটিংস থেকে কুকি দেখতে, ব্লক করতে বা মুছে ফেলতে পারেন।"></p>

  <h2 data-en="How long we keep it" data-bn="আমরা কতদিন রাখি"></h2>
  <p data-en="We keep enquiry and job details only as long as needed to serve you and to keep proper business records, then remove them. WhatsApp messages remain in our WhatsApp account unless deleted." data-bn="আপনাকে সেবা দিতে ও যথাযথ ব্যবসায়িক রেকর্ড রাখতে যতদিন প্রয়োজন কেবল ততদিন আমরা জরিপের অনুরোধ ও অনুসন্ধানের তথ্য রাখি, এরপর মুছে ফেলি। মুছে না ফেলা পর্যন্ত হোয়াটসঅ্যাপ মেসেজ আমাদের হোয়াটসঅ্যাপ অ্যাকাউন্টে থাকে।"></p>

  <h2 data-en="Your rights" data-bn="আপনার অধিকার"></h2>
  <p data-en="You may ask us to see, correct, or delete the personal information you have shared with us. Just contact us using the details above and we will help." data-bn="আপনি আমাদের কাছে শেয়ার করা ব্যক্তিগত তথ্য দেখতে, সংশোধন করতে বা মুছে ফেলতে অনুরোধ করতে পারেন। উপরের যোগাযোগ তথ্য ব্যবহার করে আমাদের জানান, আমরা সাহায্য করব।"></p>

  <h2 data-en="Children" data-bn="শিশু"></h2>
  <p data-en="For clients under 18, a parent or guardian should make contact and provide the information on the child’s behalf." data-bn="১৮ বছরের কম বয়সী ক্লায়েন্টদের জন্য অভিভাবক যোগাযোগ করবেন এবং শিশুর পক্ষে তথ্য দেবেন।"></p>

  <h2 data-en="Visitors from outside Bangladesh" data-bn="বাংলাদেশের বাইরের ভিজিটর"></h2>
  <p data-en="We welcome non-resident Bangladeshi and overseas clients. If you contact us from abroad, your information may be processed in Bangladesh and by the third-party services listed above. Please only share what you are comfortable sharing." data-bn="আমরা প্রবাসী বাংলাদেশি ও বিদেশি ক্লায়েন্টদের স্বাগত জানাই। বিদেশ থেকে যোগাযোগ করলে আপনার তথ্য বাংলাদেশে এবং উপরে উল্লিখিত তৃতীয় পক্ষের সেবায় প্রক্রিয়াজাত হতে পারে। অনুগ্রহ করে কেবল ততটুকুই শেয়ার করুন যতটুকুতে আপনি স্বাচ্ছন্দ্য।"></p>

  <h2 data-en="Changes to this policy" data-bn="এই পলিসির পরিবর্তন"></h2>
  <p data-en="We may update this policy from time to time. The “last updated” date at the top shows when it last changed." data-bn="আমরা সময়ে সময়ে এই পলিসি হালনাগাদ করতে পারি। উপরের “সর্বশেষ হালনাগাদ” তারিখ দেখায় এটি কখন সর্বশেষ পরিবর্তিত হয়েছে।"></p>

  <h2 data-en="Contact us" data-bn="যোগাযোগ করুন"></h2>
  <p data-en="Questions about your privacy? Call 01XXXXXXXXX, WhatsApp 01XXXXXXXXX, or email hello@example.com." data-bn="আপনার গোপনীয়তা নিয়ে প্রশ্ন? ফোন করুন ০১XXXXXXXXX, হোয়াটসঅ্যাপ ০১XXXXXXXXX, অথবা ইমেইল hello@example.com।"></p>
