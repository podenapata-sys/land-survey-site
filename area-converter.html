<script>
document.getElementById('yr').textContent = new Date().getFullYear();

/* The SAME units.convert table the fee estimator reads, so the converter and
   the estimator can never disagree about what a katha is. */
var U    = (window.CLINIC && window.CLINIC.units) || {};
var LIST = U.convert || [];
var SQFT = U.sqftPerBase || 435.6;

function lang(){ return document.documentElement.getAttribute('data-lang') === 'bn' ? 'bn' : 'en'; }
var BN = '০১২৩৪৫৬৭৮৯';
function toBn(s){ return String(s).replace(/[0-9]/g, function(d){ return BN.charAt(+d); }); }

/* Land is bought in fractions, so trailing zeros are noise but the first
   significant digits are not: 0.0023 acre has to survive rounding. */
function fmtNum(n){
  if (!isFinite(n)) return '—';
  var s;
  if (n === 0)        s = '0';
  else if (n >= 1000) s = Math.round(n).toLocaleString('en-IN');
  else if (n >= 1)    s = n.toFixed(3).replace(/\.?0+$/, '');
  else                s = n.toPrecision(3).replace(/\.?0+$/, '');
  return lang() === 'bn' ? toBn(s) : s;
}
function unitName(u){ return lang() === 'bn' ? u.bn : u.en; }

function buildUnits(){
  var sel = document.getElementById('convUnit');
  var cur = sel.value;
  sel.innerHTML = LIST.map(function(u){
    return '<option value="' + u.key + '">' + unitName(u) + '</option>';
  }).join('');
  sel.value = cur || (U.base || (LIST[0] && LIST[0].key));
}

function render(){
  var amt  = parseFloat(document.getElementById('convAmt').value);
  var key  = document.getElementById('convUnit').value;
  var from = LIST.filter(function(u){ return u.key === key; })[0];
  var out  = document.getElementById('convOut');
  if (!from || !isFinite(amt) || amt < 0) { out.innerHTML = ''; return; }

  var inBase = amt * from.inBase;          // everything goes through the base unit
  out.innerHTML = LIST.map(function(u){
    var v = inBase / u.inBase;
    return '<li class="' + (u.key === key ? 'is-src' : '') + '">' +
             '<span class="cu">' + unitName(u) + '</span>' +
             '<span class="cv">' + fmtNum(v) + '</span>' +
           '</li>';
  }).join('');

  document.getElementById('convRef').innerHTML = LIST.map(function(u){
    return '<tr><td>' + unitName(u) + '</td><td>' + fmtNum(u.inBase * SQFT) + '</td></tr>';
  }).join('');

  var std = (U.standard && (lang() === 'bn' ? U.standard.bn : U.standard.en)) || '';
  document.getElementById('convStd').textContent = std;
}

function applyLang(l){
  document.documentElement.setAttribute('data-lang', l);
  document.body.classList.toggle('bn', l === 'bn');
  try { localStorage.setItem('clinic_lang', l); } catch(e){}
  document.querySelectorAll('[data-en]').forEach(function(el){
    el.textContent = (l === 'bn' ? el.getAttribute('data-bn') : el.getAttribute('data-en'));
  });
  var t = document.getElementById('langText'); if (t) t.textContent = (l === 'bn' ? 'EN' : 'বাংলা');
  buildUnits(); render();
}

var L = 'bn'; try { L = localStorage.getItem('clinic_lang') || 'bn'; } catch(e){}
applyLang(L);
document.getElementById('langToggle').onclick = function(){
  applyLang(document.documentElement.getAttribute('data-lang') === 'bn' ? 'en' : 'bn');
};
document.getElementById('convAmt').addEventListener('input', render);
document.getElementById('convUnit').addEventListener('change', render);
var bg = document.getElementById('burger'), nv = document.getElementById('navlist');
if (bg) bg.onclick = function(){ nv.classList.toggle('open'); };
</script>
