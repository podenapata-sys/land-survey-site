<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Example Land Survey — Example Land Survey</title>
<link rel="icon" type="image/png" href="assets/mark-square.svg?v=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root{--navy:#13294e;--navy2:#1c3a63;--teal:#57C3AD;--teal-dd:#2c8a78;--blue:#2B6CB0;
  --orange:#F08A24;--ink:#16323c;--muted:#5b7682;--line:#e7eef1;--bg:#eef4f6;--card:#fff;
  --ok:#1c9c6b;--due:#d9760f;--danger:#d94848;--r:16px;
  --f:'Inter',system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  --fh:'Sora','Inter',system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;font-family:var(--f);color:var(--ink);background:
  radial-gradient(900px 500px at 100% -10%,rgba(87,195,173,.16),transparent 60%),
  radial-gradient(700px 400px at -10% 110%,rgba(43,108,176,.12),transparent 60%),var(--bg);
  min-height:100vh;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--fh);color:var(--navy);margin:0}
.wrap{max-width:1120px;margin:0 auto;padding:18px}
/* the records table is 11 columns wide; on a desktop screen give it the room rather
   than making the clinic scroll a table sideways */
@media(min-width:1240px){.wrap{max-width:1280px}}
/* ---- lock screen ---- */
#lock{position:fixed;inset:0;z-index:50;display:grid;place-items:center;
  background:linear-gradient(160deg,#0f2444,#183a67);padding:20px}
.lockcard{background:#fff;border-radius:22px;box-shadow:0 30px 70px -20px rgba(0,0,0,.5);
  width:100%;max-width:360px;padding:30px 26px;text-align:center}
.lockcard img{height:52px;margin-bottom:10px}
.lockcard h2{font-size:1.25rem;margin-bottom:4px}
.lockcard p{color:var(--muted);font-size:.9rem;margin:0 0 18px}
.pin{width:100%;text-align:center;font-size:1.5rem;letter-spacing:.4em;padding:12px;
  border:2px solid var(--line);border-radius:12px;font-family:var(--fh);font-weight:700}
.pin:focus{outline:none;border-color:var(--teal)}
.lockmsg{color:var(--danger);font-size:.85rem;min-height:1.1em;margin-top:8px}
.btn{border:none;cursor:pointer;font-family:var(--fh);font-weight:700;border-radius:12px;
  padding:12px 18px;font-size:.95rem;transition:transform .12s,box-shadow .12s,background .15s}
.btn:active{transform:translateY(1px)}
.btn-p{background:linear-gradient(120deg,var(--teal),var(--blue));color:#fff;
  box-shadow:0 10px 22px -8px rgba(43,108,176,.6);width:100%;margin-top:14px}
.btn-g{background:#fff;color:var(--navy);border:1.5px solid var(--line)}
.btn-g:hover{border-color:var(--teal);color:var(--teal-dd)}
.btn-sm{padding:8px 12px;font-size:.82rem}
.btn-o{background:linear-gradient(120deg,#F5A94C,var(--orange));color:#fff}
/* ---- topbar ---- */
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:6px 0 18px}
.top .brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.top .brand img{height:40px}
.top .brand b{font-family:var(--fh);font-weight:800;color:var(--navy);font-size:1.15rem;line-height:1}
.top .brand small{display:block;font-size:.6rem;letter-spacing:.32em;color:var(--orange);font-weight:700}
.top h1{font-size:1.05rem}
.spacer{flex:1}
.top .btn{white-space:nowrap}
.hint{background:#fff6e9;border:1px solid #f6d9b0;color:#8a5a12;border-radius:12px;
  padding:10px 14px;font-size:.82rem;margin-bottom:16px;display:flex;gap:8px;align-items:flex-start}
/* ---- panels ---- */
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:0 12px 30px -18px rgba(19,41,78,.28);padding:18px;margin-bottom:18px}
.panel h3{font-size:1rem;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.form-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.fld{display:flex;flex-direction:column;gap:5px}
.fld label{font-size:.72rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.fld input,.fld select{padding:10px 11px;border:1.5px solid var(--line);border-radius:10px;
  font-family:var(--f);font-size:.92rem;color:var(--ink);background:#fff;width:100%}
.fld input:focus,.fld select:focus{outline:none;border-color:var(--teal)}
.fld .ro{background:#f2f7f6;font-weight:700;color:var(--teal-dd);font-family:var(--fh)}
/* The browser draws <input type="date"> itself, in ITS OWN locale order — often
   MM/DD/YYYY — and a page cannot restyle or reorder that. So we show our own
   DD-MM-YYYY text and keep the real input on top at zero opacity: taps still open the
   native calendar, and every existing read of .value still gets ISO. */
.datebox{position:relative;display:block}
.datebox-txt{display:block;padding:10px 11px;border:1.5px solid var(--line);border-radius:10px;
  font-family:var(--f);font-size:.92rem;color:var(--ink);background:#fff;width:100%;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.datebox-txt.dt-ph{color:var(--muted)}   /* NOT .empty — that is the "no records" panel, padding:40px */
.datebox input{position:absolute;inset:0;width:100%;height:100%;opacity:0;
  border:0;padding:0;margin:0;background:transparent;cursor:pointer}
.datebox:focus-within .datebox-txt{border-color:var(--teal)}
.datebox-inline{display:inline-block;width:auto;min-width:132px;vertical-align:middle}
.datebox-inline .datebox-txt{padding:8px 12px;font-size:.88rem;border-radius:10px}
.form-actions{display:flex;gap:10px;align-items:center;margin-top:14px;flex-wrap:wrap}
/* ---- stats ---- */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;
  box-shadow:0 12px 30px -18px rgba(19,41,78,.28)}
.stat .n{font-family:var(--fh);font-weight:800;font-size:1.8rem;line-height:1.1;overflow-wrap:anywhere}
.stat .l{font-size:.78rem;color:var(--muted);margin-top:4px;font-weight:600}
.stat.blue .n{color:var(--blue)} .stat.teal .n{color:var(--teal-dd)}
.stat.ok .n{color:var(--ok)} .stat.due .n{color:var(--due)}
/* ---- toolbar ---- */
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.tabs{display:inline-flex;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px;gap:2px;max-width:100%}
.tab{border:none;background:none;cursor:pointer;font-family:var(--fh);font-weight:700;font-size:.85rem;
  color:var(--muted);padding:7px 15px;border-radius:999px}
.tab.active{background:linear-gradient(120deg,var(--teal),var(--blue));color:#fff}
.tools input[type=date],.tools input[type=month]{padding:8px 10px;border:1.5px solid var(--line);
  border-radius:10px;font-family:var(--f);font-size:.88rem}
/* ---- table ---- */
.tablewrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:0 12px 30px -18px rgba(19,41,78,.28)}
table{border-collapse:collapse;width:100%;min-width:940px}
th,td{padding:11px 9px;text-align:left;font-size:.86rem;border-bottom:1px solid var(--line);white-space:nowrap}
/* Name, Address and Service are the long columns; letting just those wrap keeps the
   11-column table inside its container instead of forcing a horizontal scrollbar that
   clipped the Delete button at ~1280px. */
th:nth-child(4),td:nth-child(4),th:nth-child(6),td:nth-child(6){white-space:normal;min-width:9ch}
/* An address is the longest thing in the row: left alone it pushed the table to 1300px
   and the Delete button out past the right edge. A max-width on the <td> is only a
   suggestion in auto table layout, so the clamp lives on a block child — that DOES cap
   the column's width — and the full text goes to the tooltip. */
td.addr .ad{display:block;max-width:20ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
th{background:#f6faf9;font-family:var(--fh);font-weight:700;color:var(--navy);font-size:.74rem;
  text-transform:uppercase;letter-spacing:.04em;position:sticky;top:0;
  /* two-word headings wrap onto two lines rather than setting the column width:
     "CUSTOMER ID" and "NEXT APPT." are wider than anything underneath them */
  white-space:normal}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:#f8fcfb}
/* Between the phone card layout and a wide desktop the table still has to scroll
   sideways. Pinning the buttons to the right edge means Edit and Delete are always
   under the cursor instead of hidden past the end of the scroll. */
th:last-child,td.actions{position:sticky;right:0;background:var(--card)}
th:last-child{background:#f6faf9}
th:last-child::before,td.actions::before{content:"";position:absolute;top:0;bottom:0;left:-10px;
  width:10px;pointer-events:none;box-shadow:inset -10px 0 8px -8px rgba(19,41,78,.28)}
tbody tr:hover td.actions{background:#f8fcfb}
.cid{font-family:var(--fh);font-weight:700;color:var(--blue)}
.due-pos{color:var(--due);font-weight:700} .due-zero{color:var(--ok);font-weight:700}
.rowbtn{border:none;background:none;cursor:pointer;font-size:1rem;padding:4px 6px;border-radius:6px}
.rowbtn:hover{background:#eef4f6}
.rowbtn{text-decoration:none}
.when{color:var(--muted);font-weight:600;font-size:.82em}
.tab-bin{margin-left:6px}
/* ---- report ---- */
.rep{margin-bottom:18px;display:none}
.rep h3{margin-bottom:12px}
.rep-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:18px}
@media(max-width:820px){.rep-grid{grid-template-columns:1fr}}
.bar-row{display:grid;grid-template-columns:74px 1fr auto;gap:10px;align-items:center;margin-bottom:7px;font-size:.85rem}
.bar-track{background:#eef4f6;border-radius:6px;overflow:hidden;height:20px}
.bar-fill{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--blue));border-radius:6px;min-width:2px}
.bar-val{font-variant-numeric:tabular-nums;font-weight:700;color:var(--navy);white-space:nowrap}
.rep-mut{color:var(--muted);font-size:.85rem}
.empty{padding:40px;text-align:center;color:var(--muted)}
.badge{display:inline-block;background:#eaf6f2;color:var(--teal-dd);font-weight:700;font-size:.78rem;
  padding:3px 9px;border-radius:999px}
@media(max-width:820px){.form-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  /* the long values get the whole row once the grid is only two wide */
  .fld.wide{grid-column:1 / -1}}
@media(max-width:520px){.form-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .top h1{display:none}.top .btn{padding:9px 12px;font-size:.8rem}}

/* ---- phones: the 11-column table becomes one card per client, so the Edit/Delete
   buttons are reachable without scrolling 10 columns sideways ---- */
@media(max-width:620px){
  .tablewrap{overflow-x:visible;background:none;border:none;box-shadow:none;border-radius:0}
  table{min-width:0}
  thead{display:none}
  tbody tr{display:block;position:relative;background:var(--card);border:1px solid var(--line);
    border-radius:var(--r);box-shadow:0 10px 24px -18px rgba(19,41,78,.28);
    padding:52px 13px 6px;margin-bottom:12px}
  tbody tr:hover{background:var(--card)}
  tbody td{display:flex;justify-content:space-between;align-items:baseline;gap:14px;
    padding:8px 0;white-space:normal;font-size:.95rem;text-align:right;
    border-bottom:1px dashed var(--line)}
  tbody td:last-child{border-bottom:none}
  /* on a card there is no column to line up with, so an address that was recorded shows
     in full and one that was not shows nothing at all */
  tbody td.addr .ad{max-width:none;white-space:normal;overflow:visible}
  tbody td.is-empty{display:none}
  tbody td::before{content:attr(data-label);flex:0 0 auto;text-align:left;
    font-family:var(--fh);font-weight:700;font-size:.71rem;text-transform:uppercase;
    letter-spacing:.04em;color:var(--muted)}
  tbody td.actions{position:absolute;top:8px;right:10px;left:10px;padding:0;border:none;
    display:flex;justify-content:flex-end;gap:8px}
  tbody td.actions::before{content:none}
  .rowbtn{min-width:44px;min-height:44px;display:inline-flex;align-items:center;
    justify-content:center;font-size:1.15rem;background:#f2f7f9}
  .stat{padding:14px}
  .stat .n{font-size:1.45rem}
  .top{flex-wrap:wrap;gap:8px}
  .tools{flex-wrap:wrap;gap:8px}
  #searchBox{flex:1 1 100%;min-width:0}
}
</style>
</head>
<body>

<!-- LOCK SCREEN -->
<div id="lock">
  <div class="lockcard">
    <img src="assets/mark.svg?v=3" alt="Example Land Survey">
    <h2 id="lockTitle">Enter PIN</h2>
    <p id="lockSub">Admin access — Example Land Survey</p>
    <input class="pin" id="pinInput" type="password" inputmode="numeric" maxlength="8" autocomplete="off" placeholder="••••">
    <div class="lockmsg" id="lockMsg"></div>
    <button class="btn btn-p" id="pinBtn">Unlock</button>
  </div>
</div>

<!-- DASHBOARD -->
<div class="wrap" id="dash" style="display:none">
  <div class="top">
    <a class="brand" href="index.html">
      <img src="assets/mark.svg?v=3" alt="Example Land Survey">
      <span><b>EXAMPLE<small>LAND SURVEY</small></b></span>
    </a>
    <h1>Admin Dashboard</h1>
    <span class="spacer"></span>
    <button class="btn btn-g btn-sm" id="reportBtn">📊 Report</button>
    <a class="btn btn-p btn-sm" id="siteBtn" href="admin-content.html" style="width:auto;text-decoration:none;display:inline-flex;align-items:center">🌐 Website</a>
    <button class="btn btn-g btn-sm" id="importBtn">⬆ Import backup</button>
    <button class="btn btn-o btn-sm" id="backupBtn">⬇ Backup all (Excel)</button>
    <button class="btn btn-g btn-sm" id="driveBtn" style="display:none">☁ Backup to Drive</button>
    <button class="btn btn-g btn-sm" id="lockBtn">🔒 Lock</button>
  </div>

  <div class="hint" id="syncNote"><span id="syncIcon">💾</span> <span id="syncText">Records are saved in this browser. Sign in below to sync them across your devices.</span></div>

  <!-- REPORT -->
  <div class="panel rep" id="repPanel">
    <h3>📊 Income report</h3>
    <div class="rep-grid">
      <div>
        <div class="rep-mut" style="margin-bottom:9px">Collected per month (last 12)</div>
        <div id="repMonths"></div>
      </div>
      <div>
        <div class="rep-mut" style="margin-bottom:9px">Top services by income</div>
        <div id="repServices"></div>
      </div>
    </div>
    <div class="rep-mut" id="repTotals" style="margin-top:14px"></div>
  </div>

  <!-- ADD / EDIT -->
  <div class="panel">
    <h3 id="formTitle">➕ Add a client record</h3>
    <div class="form-grid">
      <div class="fld"><label>Mobile Number</label><input id="f_mobile" type="tel" inputmode="numeric" placeholder="01XXXXXXXXX"></div>
      <div class="fld"><label>Customer ID (auto)</label><input id="f_id" class="ro" readonly placeholder="OD-####"></div>
      <div class="fld wide"><label>Client Name (optional)</label><input id="f_name" type="text" placeholder="Name"></div>
      <div class="fld wide"><label>Address (optional)</label><input id="f_address" type="text" placeholder="House / road / area"></div>
      <div class="fld wide"><label>Service Taken</label>
        <select id="f_service">
          <option value="">Select a service…</option>
          <option>Amin Land Measurement</option><option>Boundary Demarcation</option><option>Digital / GPS Survey</option><option>Total Station Survey</option><option>Khatian Search — RS / BS</option><option>Khatian Search — CS / SA</option><option>Mouza Map Collection</option><option>Mouza Map Tracing</option><option>Dag Number Verification</option><option>Inheritance Partition Survey</option><option>Court-admissible Survey Report</option><option>Full Pre-purchase Check</option><option>Deed vs Dag Reconciliation</option>";
    sel.innerHTML = html;
  }

  function clearForm(){
    ["f_mobile","f_name","f_address","f_total","f_paid","f_next"].forEach(function(k){$(k).value="";});
    $("f_service").value=""; $("f_service_other").value=""; $("f_service_other").style.display="none";
    $("f_date").value=todayStr(); recalc();
    editId=null; $("saveBtn").textContent="Add record"; $("formTitle").textContent="➕ Add a client record";
    $("cancelBtn").style.display="none"; syncDateBoxes();
  }
  function saveRecord(){
    var mobile=$("f_mobile").value.trim();
    if(digits(mobile).length<4){ flash("Enter a valid mobile number (for the Customer ID).",true); $("f_mobile").focus(); return; }
    var totalV=Number($("f_total").value)||0, paidV=Number($("f_paid").value)||0;
    if(totalV<0 || paidV<0){ flash("Amounts cannot be negative.",true); $("f_total").focus(); return; }
    /* A negative due would render as paid-up and cancel out other clients' dues
       in the Due stat, so block it rather than storing it. */
    if(paidV>totalV){ flash("Paid ("+money(paidV)+") is more than Total ("+money(totalV)+").",true); $("f_paid").focus(); return; }
    var rec={
      _id: editId || (Date.now()+"-"+Math.floor(performance.now()%100000)),
      date: $("f_date").value || todayStr(),
      mobile: mobile, id: cid(mobile),
      name: $("f_name").value.trim(),
      address: $("f_address").value.trim(),
      service: getService(),
      total: Number($("f_total").value)||0,
      paid: Number($("f_paid").value)||0,
      next: $("f_next").value || ""
    };
    if(editId){ var i=records.findIndex(function(r){return r._id===editId;}); if(i>-1)records[i]=rec; }
    else records.push(rec);
    save(); cloudSave(rec); clearForm(); render(); flash("Saved ✓",false);
  }
  function flash(msg,err){ var el=$("formMsg"); el.textContent=msg; el.style.color=err?"#d94848":"#2c8a78"; setTimeout(function(){el.textContent="";},2600); }
  function editRow(id){
    var r=records.find(function(x){return x._id===id;}); if(!r)return;
    editId=id; $("f_mobile").value=r.mobile; $("f_name").value=r.name||""; $("f_address").value=r.address||""; setService(r.service||"");
    $("f_total").value=r.total; $("f_paid").value=r.paid; $("f_date").value=r.date; $("f_next").value=r.next||"";
    recalc(); syncDateBoxes();
    $("saveBtn").textContent="Update record"; $("formTitle").textContent="✏️ Edit record"; $("cancelBtn").style.display="inline-block";
    window.scrollTo({top:0,behavior:"smooth"});
  }
  /* Money coming in, rather than a correction. Editing the record means overwriting Paid,
     which asks the clinic to do the arithmetic and retype over figures that were right. */
  function takePayment(id){
    var r=records.find(function(x){return x._id===id;}); if(!r)return;
    var due=dueOf(r);
    if(due<=0){ flash("That visit is already paid in full.",true); return; }
    var raw=prompt("Payment from "+(r.name||r.mobile)+" ("+r.id+")\n"
                 + "Outstanding: "+money(due)+"\n\nHow much are they paying now?", "");
    if(raw===null) return;                       // cancelled
    var amt=Math.round(Number(String(raw).trim()));
    if(!isFinite(amt) || amt<=0){ flash("Enter the amount as a number, e.g. 5000.",true); return; }
    /* saveRecord() blocks paid > total because a negative due reads as paid-up and cancels
       other clients out of the Outstanding due total. A payment must not sneak past it. */
    if(amt>due){ flash("That is more than the "+money(due)+" outstanding.",true); return; }
    r.paid=(Number(r.paid)||0)+amt;
    save(); cloudSave(r); render();
    var left=dueOf(r);
    flash(left>0 ? ("Payment of "+money(amt)+" recorded — "+money(left)+" still due.")
                 : ("Payment of "+money(amt)+" recorded — paid in full ✓"), false);
  }

  /* The same client back for another job. cid() derives the Customer ID from the
     mobile, so filling in the mobile is what keeps them on one ID. */
  function newJob(id){
    var r=records.find(function(x){return x._id===id;}); if(!r)return;
    clearForm();                                  // clears editId, so Save ADDS a record
    $("f_mobile").value=r.mobile||"";
    $("f_name").value=r.name||"";
    $("f_address").value=r.address||"";   /* same client, same address */
    recalc();
    $("formTitle").textContent="➕ New job — "+(r.name||r.mobile)+" ("+r.id+")";
    $("f_service").focus();
    window.scrollTo({top:0,behavior:"smooth"});
    flash("Same client, same Customer ID. Choose the service and enter the amounts.",false);
  }

  function delRow(id){
    var r=records.find(function(x){return x._id===id;}); if(!r)return;
    if(!confirm("Delete record "+r.id+" ("+(r.name||r.mobile)+") on "+dmy(r.date)+"?\n\nIt moves to the Bin and can be restored for "+TRASH_DAYS+" days."))return;
    r.deletedAt = new Date().toISOString();
    save(); cloudSave(r); render();
    flash("Moved to Bin — restore it from 🗑 Bin.",false);
  }
  function restoreRow(id){
    var r=records.find(function(x){return x._id===id;}); if(!r)return;
    delete r.deletedAt; save(); cloudSave(r); render();
    flash("Restored ✓",false);
  }
  function purgeRow(id){
    var r=records.find(function(x){return x._id===id;}); if(!r)return;
    if(!confirm("Delete "+r.id+" permanently? This cannot be undone."))return;
    records=records.filter(function(x){return x._id!==id;}); save(); cloudRemove(id); render();
  }
  /* anything past the window goes for real, on load and on every render */
  function purgeExpired(){
    var gone=records.filter(function(r){ return isDeleted(r) && daysSince(r.deletedAt)>=TRASH_DAYS; });
    if(!gone.length) return;
    var ids={}; gone.forEach(function(r){ ids[r._id]=1; });
    records=records.filter(function(r){ return !ids[r._id]; });
    save(); gone.forEach(function(r){ cloudRemove(r._id); });
  }

  /* ---------- filtering + render ---------- */
  /* Last 7 days ending today, inclusive. Must be built with the SAME local-date
     formatter as todayStr() and the stored r.date - toISOString() is UTC and in
     Dhaka (UTC+6) slipped the boundary a day back before 06:00, giving 8 days. */
  function weekStart(){ var d=new Date(); d.setDate(d.getDate()-6); return fmtLocal(d); }
  function dueOf(r){ return (Number(r.total)||0)-(Number(r.paid)||0); }
  function inView(r){
    if(view==="all") return true;
    /* next = the survey request they are booked for; show today onward */
    if(view==="upcoming") return !!r.next && r.next >= todayStr();
    if(view==="dues") return dueOf(r) > 0;
    if(view==="today") return r.date===($("dayPick").value||todayStr());
    if(view==="week"){ return r.date>=weekStart() && r.date<=todayStr(); }
    if(view==="month"){ return (r.date||"").slice(0,7)===($("monthPick").value||todayStr().slice(0,7)); }
    return true;
  }
  function filtered(){
    var q=(searchTerm||"").trim().toLowerCase();
    if(view==="bin")   // the Bin is the one view that shows tombstones, newest first
      return trashed().sort(function(a,b){ return String(b.deletedAt).localeCompare(String(a.deletedAt)); });
    var base = q ? live() : live().filter(inView);  // searching spans all dates
    if(q) base = base.filter(function(r){
      return [r.name, r.mobile, r.id, r.service, r.address].join(" ").toLowerCase().indexOf(q) > -1;
    });
    if(!q && view==="upcoming")   // soonest survey request first
      return base.sort(function(a,b){ return (a.next+a._id).localeCompare(b.next+b._id); });
    if(!q && view==="dues")       // biggest balance first
      return base.sort(function(a,b){ return dueOf(b)-dueOf(a) || (b.date+b._id).localeCompare(a.date+a._id); });
    return base.sort(function(a,b){ return (b.date+b._id).localeCompare(a.date+a._id); });
  }
  function viewText(){ /* every branch returns; final return is the safety net */
    var q=(searchTerm||"").trim();
    if(q) return 'search "'+q+'" (all dates)';
    if(view==="all") return "all records";
    if(view==="today") return dmy($("dayPick").value||todayStr());
    if(view==="week") return "this week (last 7 days)";
    if(view==="month") return my($("monthPick").value||todayStr().slice(0,7));
    if(view==="upcoming") return "upcoming survey request";
    if(view==="dues") return "unpaid balances";
    if(view==="bin") return "deleted records (kept "+TRASH_DAYS+" days)";
    return "all records";
  }
  /* "· today" / "· in 3 days" beside an upcoming survey request date */
  function whenHint(next){
    if(view!=="upcoming") return "";
    var d=Math.round((Date.parse(next+"T00:00:00")-Date.parse(todayStr()+"T00:00:00"))/86400000);
    if(isNaN(d)) return "";
    var txt = d===0?"today" : d===1?"tomorrow" : d>0?("in "+d+" days") : "";
    return txt ? " <span class='when'>· "+txt+"</span>" : "";
  }
  /* one-tap payment reminder; site-wide format is wa.me/880XXXXXXXXXX<local number> */
  function waBtn(r,due){
    var d=digits(r.mobile); if(d.length<10) return "";
    var msg="Assalamu alaikum"+(r.name?" "+r.name:"")+", this is Example Land Survey. "
      + "You have an outstanding balance of Tk "+(due).toLocaleString("en-IN")
      + " for "+(r.service||"your survey")+" on "+dmy(r.date)+". Please contact us to settle it. Thank you.";
    return "<a class='rowbtn' target='_blank' rel='noopener' title='Send payment reminder' "
      + "aria-label='Send WhatsApp payment reminder' href='https://wa.me/880XXXXXXXXXX"+d
      + "?text="+encodeURIComponent(msg)+"'>💬</a>";
  }

  function bars(items, el){
    var max = items.reduce(function(m,i){ return Math.max(m, i.v); }, 0) || 1;
    el.innerHTML = items.length ? items.map(function(i){
      return "<div class='bar-row'><span class='rep-mut'>"+esc(i.k)+"</span>"
        + "<span class='bar-track'><span class='bar-fill' style='width:"+Math.max(2,Math.round(i.v/max*100))+"%'></span></span>"
        + "<span class='bar-val'>"+money(i.v)+"</span></div>";
    }).join("") : "<div class='rep-mut'>No data yet.</div>";
  }
  function renderReport(){
    var panel=$("repPanel"); if(!panel || panel.style.display!=="block") return;
    var rs=live(), byMonth={}, byService={}, tot=0, paid=0;
    rs.forEach(function(r){
      var m=(r.date||"").slice(0,7); if(m) byMonth[m]=(byMonth[m]||0)+(Number(r.paid)||0);
      var sv=(r.service||"Other").trim()||"Other";
      byService[sv]=(byService[sv]||0)+(Number(r.paid)||0);
      tot+=Number(r.total)||0; paid+=Number(r.paid)||0;
    });
    var months=Object.keys(byMonth).sort().slice(-12).map(function(k){ return {k:my(k), v:byMonth[k]}; });
    var svcs=Object.keys(byService).map(function(k){ return {k:k, v:byService[k]}; })
                   .sort(function(a,b){ return b.v-a.v; }).slice(0,8);
    bars(months, $("repMonths"));
    bars(svcs, $("repServices"));
    $("repTotals").innerHTML = rs.length
      ? "All time: <b>"+rs.length+"</b> visits · billed <b>"+money(tot)+"</b> · collected <b>"+money(paid)+"</b> · outstanding <b>"+money(tot-paid)+"</b>"
      : "No records yet.";
  }

  function render(){
    purgeExpired();
    var rows=filtered(), tb=$("tbody"), html="";
    var tot=0,paid=0;
    rows.forEach(function(r){
      tot+=Number(r.total)||0; paid+=Number(r.paid)||0;
      var due=(Number(r.total)||0)-(Number(r.paid)||0);
      html+="<tr>"+
        "<td data-label='Date'>"+esc(dmy(r.date))+"</td>"+
        "<td data-label='Customer ID' class='cid'>"+esc(r.id)+"</td>"+
        "<td data-label='Mobile'>"+esc(r.mobile)+"</td>"+
        "<td data-label='Name'>"+esc(r.name||"—")+"</td>"+
        "<td data-label='Address' class='addr"+(r.address?"":" is-empty")+"'>"+
          "<span class='ad' title='"+esc(r.address||"")+"'>"+esc(r.address||"—")+"</span></td>"+
        "<td data-label='Service'>"+esc(r.service||"—")+"</td>"+
        "<td data-label='Total' class='num'>"+money(r.total)+"</td>"+
        "<td data-label='Paid' class='num'>"+money(r.paid)+"</td>"+
        "<td data-label='Due' class='num "+(due>0?"due-pos":"due-zero")+"'>"+money(due)+"</td>"+
        "<td data-label='Next Appt.'>"+(r.next?(esc(dmy(r.next))+whenHint(r.next)):"—")+"</td>"+
        "<td class='actions' style='text-align:right;white-space:nowrap'>"+
          (view==="bin"
            ? "<button class='rowbtn' data-restore='"+r._id+"' title='Restore' aria-label='Restore record'>↩️</button>"+
              "<button class='rowbtn' data-purge='"+r._id+"' title='Delete forever' aria-label='Delete forever'>❌</button>"
            : (due>0 ? waBtn(r,due) : "")+
              (due>0 ? "<button class='rowbtn' data-pay='"+r._id+"' title='Take a payment' aria-label='Take a payment'>💵</button>" : "")+
              "<button class='rowbtn' data-new='"+r._id+"' title='New job for this client' aria-label='New job for this client'>➕</button>"+
              "<button class='rowbtn' data-edit='"+r._id+"' title='Edit' aria-label='Edit record'>✏️</button>"+
              "<button class='rowbtn' data-del='"+r._id+"' title='Delete' aria-label='Delete record'>🗑️</button>")+
        "</td>"+
      "</tr>";
    });
    tb.innerHTML=html;
    $("emptyMsg").style.display=rows.length?"none":"block";
    $("s_count").textContent=rows.length;
    $("s_total").textContent=money(tot);
    $("s_paid").textContent=money(paid);
    $("s_due").textContent=money(tot-paid);
    $("viewLabel").textContent=viewText(); $("rowCount").textContent=rows.length;
    syncDateBoxes();
    var nt=trashed().length, bt=$("binTab");
    if(bt){ bt.textContent = nt ? ("🗑 Bin ("+nt+")") : "🗑 Bin"; bt.style.display = nt||view==="bin" ? "" : "none"; }
    renderReport();
  }

  /* ---------- export / import (SheetJS) ---------- */
  function rowsForSheet(rs){
    return rs.map(function(r){ return {
      "Date":dmy(r.date),"Customer ID":r.id,"Mobile":r.mobile,"Name":r.name||"","Address":r.address||"","Service":r.service||"",
      "Total":Number(r.total)||0,"Paid":Number(r.paid)||0,"Due":(Number(r.total)||0)-(Number(r.paid)||0),
      "Next Appointment":dmy(r.next) }; });
  }
  function makeSheetWithTotals(rs){
    var data=rowsForSheet(rs);
    var t=rs.reduce(function(a,r){return a+(Number(r.total)||0);},0);
    var p=rs.reduce(function(a,r){return a+(Number(r.paid)||0);},0);
    data.push({}); data.push({"Service":"TOTAL","Total":t,"Paid":p,"Due":t-p});
    return XLSX.utils.json_to_sheet(data,{header:["Date","Customer ID","Mobile","Name","Address","Service","Total","Paid","Due","Next Appointment"]});
  }
  /* The SheetJS vendor script is deferred; if it fails to load the identifier is
     undeclared, so a bare `!XLSX` throws ReferenceError instead of warning. */
  var XLSX_MSG="Excel engine is not loaded — check your connection and reload the page.";
  function xlsxReady(){ return typeof XLSX !== "undefined" && XLSX; }

  function download(rs,name,sheetName){
    if(!xlsxReady()){ alert(XLSX_MSG); return; }
    if(!rs.length){ alert("Nothing to export in this view."); return; }
    var wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, makeSheetWithTotals(rs), (sheetName||"Records").slice(0,31));
    XLSX.writeFile(wb, name);
  }
  function exportView(){
    var rs=filtered();
    var tag=view==="today"?($("dayPick").value||todayStr()):view==="month"?($("monthPick").value||todayStr().slice(0,7)):view;
    download(rs,"land-survey-"+tag+".xlsx","Records "+tag);
  }
  function buildBackupWorkbook(){
    if(!xlsxReady()) return null;
    var wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, makeSheetWithTotals(live().sort(function(a,b){return a.date.localeCompare(b.date);})), "All records");
    var byMonth={};
    live().forEach(function(r){ var m=(r.date||"").slice(0,7); if(!m)return; byMonth[m]=byMonth[m]||{Month:m,Jobs:0,Total:0,Paid:0}; byMonth[m].Jobs++; byMonth[m].Total+=Number(r.total)||0; byMonth[m].Paid+=Number(r.paid)||0; });
    var ms=Object.keys(byMonth).sort().map(function(m){ var o=byMonth[m]; o.Due=o.Total-o.Paid; return o; });
    if(ms.length) XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(ms,{header:["Month","Jobs","Total","Paid","Due"]}), "Monthly summary");
    return wb;
  }
  function backupAll(){
    if(!xlsxReady()){ alert(XLSX_MSG); return; }
    if(!live().length){ alert("No records to back up yet."); return; }
    XLSX.writeFile(buildBackupWorkbook(), "land-survey-backup-"+todayStr()+".xlsx");
  }
  /* expose the .xlsx bytes so the "Backup to Drive" module can upload them */
  window.__odBackupBlob = function(){
    if(!xlsxReady()) return null;
    if(!live().length) return null;
    var out = XLSX.write(buildBackupWorkbook(), {type:"array", bookType:"xlsx"});
    return new Blob([out], {type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
  };
  /* Identity of a visit, used to skip rows already present so re-importing the
     same backup does not duplicate every record. */
  function rowKey(r){
    return [String(r.date||"").trim(), digits(r.mobile||""),
            Number(r.total)||0, Number(r.paid)||0].join("|");
  }

  function importFile(file){
    if(!xlsxReady()){ alert(XLSX_MSG); return; }
    var reader=new FileReader();
    reader.onload=function(e){
      try{
        var wb=XLSX.read(e.target.result,{type:"array"});
        var ws=wb.Sheets[wb.SheetNames[0]];
        var rows=XLSX.utils.sheet_to_json(ws,{defval:""});

        var incoming=[], seq=0;
        rows.forEach(function(row){
          var mobile=String(row["Mobile"]||row["mobile"]||"").trim();
          var date=toIso(String(row["Date"]||row["date"]||"").trim());
          if(!mobile && !date) return; // skip totals/blank rows
          if(String(row["Service"]||"").toUpperCase()==="TOTAL") return;
          incoming.push({
            _id: Date.now()+"-"+(seq++)+"-"+Math.floor(Math.random()*1e6),
            date: date||todayStr(), mobile:mobile, id: cid(mobile),
            name:String(row["Name"]||"").trim(), address:String(row["Address"]||"").trim(),
            service:String(row["Service"]||"").trim(),
            total:Number(row["Total"])||0, paid:Number(row["Paid"])||0,
            next:toIso(String(row["Next Appointment"]||row["Next Appt."]||"").trim())
          });
        });

        if(!incoming.length){ alert("No records found in that file."); return; }

        var replace=false;
        if(live().length){
          replace = confirm(
            "Import "+incoming.length+" record(s).\n\n"+
            "OK = REPLACE — delete the "+live().length+" record(s) on this device first.\n"+
            "Cancel = MERGE — keep them and add only records that are not already here."
          );
        }

        var added=0, skipped=0, removedIds=[];
        if(replace){
          removedIds = live().map(function(r){return r._id;});
          /* Replace swaps out the visible records only — the Bin is left alone, so an
             import can never silently wipe something you were still able to restore. */
          records = incoming.concat(trashed()); added = incoming.length;
        }else{
          var seen={};
          live().forEach(function(r){ seen[rowKey(r)]=1; });
          incoming.forEach(function(r){
            var k=rowKey(r);
            if(seen[k]){ skipped++; return; }
            seen[k]=1; records.push(r); added++;
          });
        }
        save();
        /* mirror the same outcome to the cloud so other devices match */
        removedIds.forEach(cloudRemove);
        cloudSaveMany(replace ? incoming : incoming.filter(function(r){
          return records.indexOf(r) > -1;   // only the ones actually kept
        }));
        render();
        alert("Imported "+added+" record(s)."+(skipped?" Skipped "+skipped+" already on this device.":""));
      }catch(err){ alert("Could not read that file. Use an Excel/CSV backup exported from this dashboard."); }
    };
    reader.readAsArrayBuffer(file);
  }

  /* ---------- wire up ---------- */
  document.addEventListener("DOMContentLoaded",function(){
    load();
    buildServiceOptions();          // after load(): it reads existing records
    $("f_date").value=todayStr();
    $("dayPick").value=todayStr();
    $("monthPick").value=todayStr().slice(0,7);
    initLock();
    if(alreadyOpen()) unlock();
    $("pinBtn").addEventListener("click",tryUnlock);
    $("pinInput").addEventListener("keydown",function(e){ if(e.key==="Enter")tryUnlock(); });
    ["f_mobile","f_total","f_paid"].forEach(function(k){ $(k).addEventListener("input",recalc); });
    $("f_service").addEventListener("change",onServiceChange);
    $("saveBtn").addEventListener("click",saveRecord);
    $("cancelBtn").addEventListener("click",clearForm);
    $("lockBtn").addEventListener("click",lock);
    $("exportBtn").addEventListener("click",exportView);
    $("backupBtn").addEventListener("click",backupAll);
    $("importBtn").addEventListener("click",function(){ $("importFile").click(); });
    $("importFile").addEventListener("change",function(){ if(this.files[0])importFile(this.files[0]); this.value=""; });
    $("dayPick").addEventListener("change",render);
    $("monthPick").addEventListener("change",render);
    /* setting .value in code fires nothing, so sync on the user's edits too */
    document.querySelectorAll(".datebox input").forEach(function(inp){
      inp.addEventListener("change",syncDateBoxes);
      inp.addEventListener("input",syncDateBoxes);
    });
    syncDateBoxes();
    $("searchBox").addEventListener("input",function(){ searchTerm=this.value; render(); });
    document.querySelectorAll(".tab").forEach(function(t){
      t.addEventListener("click",function(){
        document.querySelectorAll(".tab").forEach(function(x){x.classList.remove("active");});
        t.classList.add("active"); view=t.dataset.view;
        $("dayBox").style.display=view==="today"?"inline-block":"none";
        $("monthBox").style.display=view==="month"?"inline-block":"none";
        render();
      });
    });
    $("reportBtn").addEventListener("click",function(){
      var pn=$("repPanel"), open=pn.style.display==="block";
      pn.style.display = open ? "none" : "block";
      $("reportBtn").textContent = open ? "📊 Report" : "📊 Hide report";
      if(!open){ renderReport(); pn.scrollIntoView({behavior:"smooth",block:"nearest"}); }
    });
    $("tbody").addEventListener("click",function(e){
      var b=e.target.closest("[data-edit],[data-del],[data-restore],[data-purge],[data-pay],[data-new]"); if(!b)return;
      if(b.dataset.pay) takePayment(b.dataset.pay);
      else if(b.dataset.new) newJob(b.dataset.new);
      else if(b.dataset.edit) editRow(b.dataset.edit);
      else if(b.dataset.restore) restoreRow(b.dataset.restore);
      else if(b.dataset.purge) purgeRow(b.dataset.purge);
      else delRow(b.dataset.del);
    });
  });
})();

<script type="module">
/* Live website bookings + alerts (Firebase). Isolated from the classic script above:
   if Firebase is unconfigured or blocked, the panel stays hidden and the rest of the
   dashboard is unaffected. */
(async () => {
  const cfg = window.CLINIC_FB;
  if (!cfg || !cfg.apiKey) {                       // not configured → keep panel hidden
    if (window.__odSyncStatus) window.__odSyncStatus("error",
      "Records are saved in this browser only. Back up to Excel regularly.");
    return;
  }
  const $ = (id) => document.getElementById(id);
  const panel = $("wbPanel"); if (panel) panel.style.display = "block";

  let appMod, fsMod, authMod, db, auth;
  try {
    appMod  = await import("https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js");
    fsMod   = await import("https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js");
    authMod = await import("https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js");
  } catch (e) {
    $("wbEmpty").textContent = "Couldn't load Firebase (offline?). New bookings still arrive by WhatsApp.";
    if (window.__odSyncStatus) window.__odSyncStatus("error",
      "Offline — records are saved in this browser and will sync when you are back online.");
    return;
  }
  const app = appMod.initializeApp(cfg);
  /* App Check must be initialised BEFORE Auth/Firestore. Only runs when a
     reCAPTCHA v3 site key is configured; otherwise App Check must be set to
     "Unenforce" in the Firebase console. Never blocks the dashboard. */
  const acKey = (window.CLINIC_APPCHECK_KEY || "").trim();
  if (acKey) {
    try {
      const acMod = await import("https://www.gstatic.com/firebasejs/12.18.0/firebase-app-check.js");
      acMod.initializeAppCheck(app, {
        provider: new acMod.ReCaptchaV3Provider(acKey),
        isTokenAutoRefreshEnabled: true
      });
    } catch (e) { /* App Check unavailable — enforcement must be off */ }
  }
  db = fsMod.getFirestore(app);
  auth = authMod.getAuth(app);

  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
  function beep(){
    try{
      const AC = window.AudioContext || window.webkitAudioContext; if(!AC) return;
      const ac = new AC(), o = ac.createOscillator(), g = ac.createGain();
      o.type="sine"; o.frequency.value=880; o.connect(g); g.connect(ac.destination);
      g.gain.setValueAtTime(0.001, ac.currentTime);
      g.gain.exponentialRampToValueAtTime(0.25, ac.currentTime+0.02);

  }
  function notify(title, body){
    try{ if("Notification" in window && Notification.permission==="granted")
      new Notification(title, { body: body, icon: "assets/mark-square.svg?v=1" }); }catch(e){}
  }
  const notifyBtn = $("wbNotify");
  if("Notification" in window && Notification.permission!=="granted"){

  }

  function arrivedAt(ts){

    }catch(e){ return ""; }

  }

    }catch(e){}

  function render(docs){
    const list = $("wbList"); let html="", shown=0;

      html += "<div style='border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;background:#fff'>"
        + "<div style='display:flex;gap:8px;flex-wrap:wrap;align-items:center'>"

          + "<span class='badge'>"+esc(b.phone||"")+"</span>"

          + "<span class='spacer'></span>"

              : "<button class='btn btn-p btn-sm' data-add='"+d.id+"' style='width:auto'>&#10133; Add</button>")
        + "</div>"

          + esc(b.service||"—") + (b.date?(" · "+esc(b.date)):"") + (b.time?(" "+esc(b.time)):"")

    $("wbBadge").textContent = shown; $("wbBadge").style.display = shown?"inline-block":"none";

    list.querySelectorAll("[data-add]").forEach(btn => btn.onclick = () => {
      const id = btn.dataset.add, snap = current.get(id);
      if(!snap || !window.__odAddBooking) return;
      if(alreadyAdded(id)) return;
      window.__odAddBooking(snap);
      markAdded(id);
      render(lastDocs);
      window.scrollTo({top:0,behavior:"smooth"});
    });
  }

  function subscribe(){
    const q = fsMod.query(fsMod.collection(db,"bookings"), fsMod.orderBy("createdAt","desc"), fsMod.limit(50));
    fsMod.onSnapshot(q, (snap)=>{
      if(seeded){
        snap.docChanges().forEach(ch=>{
          if(ch.type==="added"){ const b=ch.doc.data(); beep(); notify("New survey request booked", (b.name||"")+" · "+(b.service||"")); }
        });
      }
      const docs=[];
      current.clear();
      snap.forEach(d=>{
        const b=d.data();
        current.set(d.id, {name:b.name, phone:b.phone, service:b.service,
                           date:b.date, dateISO:b.dateISO, time:b.time,
                           address:b.address, note:b.note});
        docs.push(d);
      });
      lastDocs = docs;
      render(docs); seeded = true;
    }, ()=>{ $("wbEmpty").textContent = "Can't read bookings yet — make sure Email/Password sign-in is enabled and the Firestore rules are applied."; $("wbEmpty").style.display="block"; });
  }

  /* ---------- client records: cloud sync ----------
     Records used to live only in localStorage, so clearing browsing data destroyed
     them and a second device saw nothing. They now mirror into Firestore under the
     owner's account. localStorage stays as the offline cache and the never-signed-in
     fallback, so nothing here is required for the dashboard to work. */
  let recUnsub = null, recSeeded = false;

  function recDoc(id){ return fsMod.doc(db, "records", String(id)); }
  function toDoc(r){
    return { date:r.date||"", mobile:r.mobile||"", id:r.id||"", name:r.name||"",
             address:r.address||"",
             service:r.service||"", total:Number(r.total)||0, paid:Number(r.paid)||0,
             next:r.next||"",
             /* Deleting a record sets deletedAt and calls cloudSave(). Without this
                field the cloud copy looked ALIVE: a second device pulled it straight
                back out of the Bin, and anything reading records/ (the survey request
                reminder, for one) treated a cancelled visit as still booked. */
             deletedAt: r.deletedAt || "",
             updatedAt: fsMod.serverTimestamp() };
  }
  function fromDoc(d){ const v=d.data()||{}; const r = {
    _id:d.id, date:v.date||"", mobile:v.mobile||"", id:v.id||"", name:v.name||"", address:v.address||"",
    service:v.service||"", total:Number(v.total)||0, paid:Number(v.paid)||0, next:v.next||"" };
    if(v.deletedAt) r.deletedAt = v.deletedAt;   // stay deleted on every device
    return r; }

  /* Handed to the records script; every method is fire-and-forget so a slow or
     failed write never blocks the UI - the local save already happened. */
  function installCloudApi(){
    window.__odCloud = {
      save(rec){ fsMod.setDoc(recDoc(rec._id), toDoc(rec)).catch(cloudErr); },
      saveMany(list){ (list||[]).forEach(r=>fsMod.setDoc(recDoc(r._id), toDoc(r)).catch(cloudErr)); },
      remove(id){ fsMod.deleteDoc(recDoc(id)).catch(cloudErr); }
    };
  }
  function cloudErr(e){
    if(window.__odSyncStatus) window.__odSyncStatus("error",
      "Could not sync to the cloud — records are still saved in this browser.");
  }

  function subscribeRecords(){
    if(recUnsub) return;
    if(window.__odSyncStatus) window.__odSyncStatus("syncing","Loading your records…");
    recUnsub = fsMod.onSnapshot(fsMod.collection(db,"records"), (snap)=>{
      const cloud = snap.docs.map(fromDoc);
      if(!recSeeded){
        recSeeded = true;
        /* First snapshot after sign-in: anything added locally before signing in
           (or on another offline device) is not in the cloud yet. Upload it rather
           than letting the cloud snapshot overwrite and lose it. */
        const have = new Set(cloud.map(r=>r._id));
        const localOnly = (window.__odLocalRecords ? window.__odLocalRecords() : [])
                            .filter(r=>!have.has(r._id));
        installCloudApi();
        if(localOnly.length){
          window.__odCloud.saveMany(localOnly);
          if(window.__odApplyCloud) window.__odApplyCloud(cloud.concat(localOnly));
          if(window.__odSyncStatus) window.__odSyncStatus("syncing",
            "Uploading "+localOnly.length+" record(s) from this device…");
          return;   // the write refires this listener with the merged set
        }
      }
      installCloudApi();
      if(window.__odApplyCloud) window.__odApplyCloud(cloud);
      if(window.__odSyncStatus) window.__odSyncStatus("synced");
    }, ()=>{
      if(window.__odSyncStatus) window.__odSyncStatus("error",
        "Can't read your records from the cloud — check the Firestore rules. They are still saved in this browser.");
    });
  }
  function unsubscribeRecords(){
    if(recUnsub){ recUnsub(); recUnsub=null; }
    recSeeded = false; delete window.__odCloud;
    if(window.__odSyncStatus) window.__odSyncStatus("local");
  }

  authMod.onAuthStateChanged(auth, (user)=>{
    if(user){ $("wbConnect").style.display="none"; $("fbLogout").style.display="inline-block"; subscribe(); subscribeRecords(); loadSiteStats(); }
    else { $("wbConnect").style.display="block"; $("fbLogout").style.display="none"; $("wbList").innerHTML=""; $("wbEmpty").style.display="none"; unsubscribeRecords(); $("snPanel").style.display="none"; }
  });

  /* ---------- the homepage's four figures (site/stats) ----------
     Deliberately NOT incremented per booking. A booking is a request, not a treated
     job: no-shows, duplicates, staff testing the form and anything a bot posts all
     land in the same place. The clinic types the number and presses Save; the panel just
     shows how many real records exist so the figure stays anchored to something true. */
  const SN_FIELDS = ["surveys","years","services","satisfaction"];

  function snSuggest(){
    var recs = (window.__odLiveCount ? window.__odLiveCount() : 0);
    var hint = "Your dashboard holds <b>" + recs.toLocaleString("en-IN") + "</b> client record"
             + (recs===1?"":"s") + ".";
    if(recs > 0) hint += " <button class='btn btn-g btn-sm' id='snUse' style='width:auto;margin-left:8px'>Use this number</button>";
    hint += "<br><span style='font-size:.8rem'>Website bookings are not added in: "
          + "\u201c\u2795 Add to records\u201d already turns each one into a record, so counting "
          + "both would count them twice.</span>";
    $("snHint").innerHTML = hint;
    var use = $("snUse");
    if(use) use.onclick = function(){ $("sn_surveys").value = recs; $("snMsg").textContent=""; };
  }

  async function loadSiteStats(){
    $("snPanel").style.display = "block";
    snSuggest();
    try{
      const snap = await fsMod.getDoc(fsMod.doc(db,"site","stats"));
      if(snap.exists()){
        const v = snap.data();
        SN_FIELDS.forEach(function(k){ if(v[k]!==undefined && v[k]!==null) $("sn_"+k).value = v[k]; });
      }
    }catch(e){
      $("snMsg").style.color = "#d94848";
      $("snMsg").textContent = "Couldn't load — publish the site/stats rule (see DASHBOARD.md).";
    }
  }

  $("snSave").onclick = async function(){
    var out = {}, bad = null;
    SN_FIELDS.forEach(function(k){
      var raw = $("sn_"+k).value.trim();
      if(raw === "") return;                       // left blank = leave it as it is
      var n = Number(raw);
      if(!isFinite(n) || n < 0) { bad = bad || k; return; }
      if(k === "satisfaction" && n > 100) { bad = bad || k; return; }
      out[k] = Math.round(n);
    });
    if(bad){ $("snMsg").style.color="#d94848"; $("snMsg").textContent="Check the "+bad+" field — numbers only."; return; }
    if(!Object.keys(out).length){ $("snMsg").style.color="#d94848"; $("snMsg").textContent="Nothing to save."; return; }
    out.updatedAt = fsMod.serverTimestamp();
    try{
      await fsMod.setDoc(fsMod.doc(db,"site","stats"), out, {merge:true});
      $("snMsg").style.color="#2c8a78"; $("snMsg").textContent="Saved \u2713 the website is updated.";
      setTimeout(function(){ $("snMsg").textContent=""; }, 4000);
    }catch(e){
      $("snMsg").style.color="#d94848";
      $("snMsg").textContent="Couldn't save — check you are signed in and the rule is published.";
    }
  };
  /* "Lock" is only a privacy screen (it reloads the page); the Firebase session
     survives it. This ends the session properly, so the cloud copy of the records
     is no longer reachable from this device until someone signs in again. */
  $("fbLogout").onclick = async ()=>{
    if(!confirm("Sign out of the cloud?\n\nRecords stay saved in this browser, but will stop syncing until you sign in again.")) return;
    try{ await authMod.signOut(auth); }catch(e){}
  };
  $("fbLogin").onclick = async ()=>{
    const em=$("fbEmail").value.trim(), pw=$("fbPass").value; $("fbMsg").textContent="";
    if(!em||!pw){ $("fbMsg").textContent="Enter email and password."; return; }
    try{ await authMod.signInWithEmailAndPassword(auth, em, pw); $("fbPass").value=""; }
    catch(e){
      var code = String(e.code||e.message||"");
      if(code.indexOf("app-check") > -1){
        $("fbMsg").innerHTML = "App Check is blocking sign-in (your password was never checked).<br>"
          + "Fix: Firebase Console → Build → <b>App Check</b> → <b>APIs</b> tab → set "
          + "<b>Authentication</b> and <b>Cloud Firestore</b> to <b>Unenforce</b>, wait a few minutes, then reload.";
      } else if(code.indexOf("configuration-not-found") > -1){
        $("fbMsg").innerHTML = "Email/Password sign-in isn't enabled yet.<br>"
          + "Fix: Firebase Console → Build → <b>Authentication</b> → <b>Sign-in method</b> → enable <b>Email/Password</b>, then add your user under <b>Users</b>.";
      } else if(code.indexOf("invalid-credential") > -1 || code.indexOf("wrong-password") > -1 || code.indexOf("user-not-found") > -1){
        $("fbMsg").textContent = "Wrong email or password — check the user you created in Firebase → Authentication → Users.";
      } else {
        $("fbMsg").textContent = "Sign-in failed: " + code;
      }
    }
  };
})();
</script>
<!-- Backup to Google Drive (GIS token flow + Drive REST; drive.file scope only) -->
<script src="https://accounts.google.com/gsi/client" async></script>
<script>
(function(){
  var CLIENT_ID = (window.CLINIC_GOOGLE_CLIENT_ID||"").trim();
  var btn = document.getElementById("driveBtn");
  if(!CLIENT_ID || !btn) return;
  var tokenClient=null, accessToken=null, tokenExpiry=0, busy=false;
  var FOLDER = "Example Land Survey Backups";
  function setBtn(t){ btn.textContent=t; }
  function p2(n){ return String(n).padStart(2,"0"); }
  function blobToBase64(blob){ return new Promise(function(res,rej){ var r=new FileReader(); r.onload=function(){ res(String(r.result).split(",")[1]); }; r.onerror=rej; r.readAsDataURL(blob); }); }
  function gisReady(){ return window.google && google.accounts && google.accounts.oauth2; }

  function init(){
    if(!gisReady()){ setTimeout(init, 400); return; }
    tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: CLIENT_ID,
      scope: "https://www.googleapis.com/auth/drive.file",
      callback: function(resp){
        if(resp && resp.access_token){
          accessToken = resp.access_token;
          tokenExpiry = Date.now() + ((resp.expires_in?resp.expires_in:3300)*1000) - 60000;
          doUpload();
        } else { busy=false; setBtn("☁ Backup to Drive"); alert("Google sign-in was cancelled."); }
      },
      error_callback: function(err){ busy=false; setBtn("☁ Backup to Drive"); alert("Google sign-in error: "+((err&&err.type)||err||"")); }
    });
    btn.style.display = "inline-block";
    btn.onclick = function(){
      if(busy) return;
      if(!(window.__odBackupBlob && window.__odBackupBlob())){ alert("No records to back up yet."); return; }
      busy = true; setBtn("☁ Connecting…");
      if(accessToken && Date.now() < tokenExpiry) doUpload();
      else tokenClient.requestAccessToken({ prompt: accessToken ? "" : "consent" });
    };
  }

  async function driveFetch(url, opts){
    opts = opts || {}; opts.headers = opts.headers || {};
    opts.headers["Authorization"] = "Bearer " + accessToken;
    var r = await fetch(url, opts);
    if(!r.ok){ var t = await r.text().catch(function(){return "";}); throw new Error(r.status + " " + t.slice(0,180)); }
    return r;
  }
  async function ensureFolder(){
    var q = "name='"+FOLDER+"' and mimeType='application/vnd.google-apps.folder' and trashed=false";
    var r = await driveFetch("https://www.googleapis.com/drive/v3/files?spaces=drive&fields=files(id)&q="+encodeURIComponent(q));
    var j = await r.json();
    if(j.files && j.files.length) return j.files[0].id;
    var cr = await driveFetch("https://www.googleapis.com/drive/v3/files?fields=id", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ name:FOLDER, mimeType:"application/vnd.google-apps.folder" })
    });
    return (await cr.json()).id;
  }
  async function doUpload(){
    try{
      setBtn("☁ Uploading…");
      var blob = window.__odBackupBlob(); if(!blob) throw new Error("No records to back up");
      var folderId = await ensureFolder();
      var b64 = await blobToBase64(blob);
      var d = new Date();
      var stamp = d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate())+"-"+p2(d.getHours())+p2(d.getMinutes());
      var meta = { name: "land-survey-backup-"+stamp+".xlsx", parents:[folderId] };
      var boundary = "example"+Math.random().toString(16).slice(2);
      var body =
        "--"+boundary+"\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n"+JSON.stringify(meta)+
        "\r\n--"+boundary+"\r\nContent-Type: application/vnd.openxmlformats-officedocument.spreadsheetml.sheet\r\nContent-Transfer-Encoding: base64\r\n\r\n"+b64+
        "\r\n--"+boundary+"--";
      await driveFetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name",
        { method:"POST", headers:{ "Content-Type":"multipart/related; boundary="+boundary }, body: body });
      setBtn("✓ Saved to Drive");
      setTimeout(function(){ setBtn("☁ Backup to Drive"); }, 3500);
    }catch(e){
      setBtn("☁ Backup to Drive");
      alert("Drive backup failed: " + (e.message||e) +
        "\n\nIn Google Cloud Console, for the project that owns this OAuth client:" +
        "\n1. APIs & Services \u2192 Library \u2192 enable Google Drive API." +
        "\n2. OAuth consent screen \u2192 Audience \u2192 Publish app. This app asks only for" +
        "\n   drive.file (files it created), a non-sensitive scope, so publishing needs no" +
        "\n   Google review. Leaving it in Testing blocks every account not listed as a tester." +
        "\n3. Credentials \u2192 the Web client \u2192 Authorized JavaScript origins must list" +
        "\n   " + location.origin);
    }finally{ busy = false; }
  }
  init();
})();
</script>
</body>
